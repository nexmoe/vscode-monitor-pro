name: PR Test Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  # Scoped by event as well as PR: the Cloudflare Pages bot comments on every
  # PR update, and an issue_comment run sharing this group would cancel the
  # in-flight pull_request build (and the other way round).
  group: pr-vsix-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # Trusted gate: no checkout, only verifies the /build command + maintainer identity,
  # then passes the PR info to the downstream job
  gate:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      head_repo: ${{ steps.check.outputs.head_repo }}
    steps:
      - name: Check /build command and permission
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            const body = (context.payload.comment?.body || '').trim();
            if (!/^\/build(\s|$)/.test(body)) {
              core.setOutput('allowed', 'false');
              return;
            }
            const assoc = context.payload.comment.author_association;
            if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(assoc)) {
              core.setOutput('allowed', 'false');
              return;
            }
            const prNumber = context.payload.issue.number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.data.state !== 'open') {
              core.setOutput('allowed', 'false');
              return;
            }
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });
            core.setOutput('allowed', 'true');
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('head_repo', pr.data.head.repo.full_name);

  # Same-repo PRs: build automatically, no approval needed
  auto-build:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/setup

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go-backend/go.sum

      - name: Get build info
        id: info
        run: |
          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo '${{ github.event.pull_request.head.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build universal package
        run: pnpm run package:vsix:universal

      - name: Build Windows x64 package
        run: pnpm run package:vsix:win32-x64

      - name: Restore .vscodeignore after Windows x64
        run: git checkout .vscodeignore

      - name: Build Windows arm64 package
        run: pnpm run package:vsix:win32-arm64

      - name: List packages
        id: list
        run: |
          ls -lh monitor-pro-*.vsix
          echo "files=$(ls monitor-pro-*.vsix | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: vsix-pr-${{ steps.info.outputs.pr_number }}-${{ steps.info.outputs.short_sha }}
          path: "monitor-pro-*.vsix"
          retention-days: 14

      - name: Comment build result on PR
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pr-vsix-build -->';
            const prNumber = ${{ github.event.pull_request.number }};
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}
            ## PR Test Build

            - **Commit**: \`${{ github.event.pull_request.head.sha }}\`
            - **Artifacts**: \`${{ steps.list.outputs.files }}\` (see Artifacts of this [Actions run](${runUrl}), retained for 14 days)
            - **Install**: download the \`.vsix\` for your platform, then \`code --install-extension <file>.vsix\`

            | Package | Platform |
            |---|---|
            | \`*-universal.vsix\` | macOS / Linux |
            | \`*-win32-x64.vsix\` | Windows x64 |
            | \`*-win32-arm64.vsix\` | Windows ARM64 |

            > New pushes will automatically rebuild and update this comment.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # Fork PRs: only build after a maintainer comments /build
  manual-build:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.gate.outputs.head_repo }}
          ref: ${{ needs.gate.outputs.head_sha }}

      - uses: ./.github/actions/setup

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go-backend/go.sum

      - name: Get build info
        id: info
        run: |
          echo "short_sha=$(echo '${{ needs.gate.outputs.head_sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build universal package
        run: pnpm run package:vsix:universal

      - name: Build Windows x64 package
        run: pnpm run package:vsix:win32-x64

      - name: Restore .vscodeignore after Windows x64
        run: git checkout .vscodeignore

      - name: Build Windows arm64 package
        run: pnpm run package:vsix:win32-arm64

      - name: List packages
        id: list
        run: |
          ls -lh monitor-pro-*.vsix
          echo "files=$(ls monitor-pro-*.vsix | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: vsix-pr-${{ needs.gate.outputs.pr_number }}-${{ steps.info.outputs.short_sha }}
          path: "monitor-pro-*.vsix"
          retention-days: 14

      - name: Comment build result on PR
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pr-vsix-build -->';
            const prNumber = Number('${{ needs.gate.outputs.pr_number }}');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}
            ## PR Test Build

            - **Commit**: \`${{ needs.gate.outputs.head_sha }}\`
            - **Artifacts**: \`${{ steps.list.outputs.files }}\` (see Artifacts of this [Actions run](${runUrl}), retained for 14 days)
            - **Install**: download the \`.vsix\` for your platform, then \`code --install-extension <file>.vsix\`

            | Package | Platform |
            |---|---|
            | \`*-universal.vsix\` | macOS / Linux |
            | \`*-win32-x64.vsix\` | Windows x64 |
            | \`*-win32-arm64.vsix\` | Windows ARM64 |

            > Comment \`/build\` again after new pushes to rebuild; this comment will be updated.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
