name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Line endings are not guaranteed across runners: the Windows image checks
      # code out with CRLF, while prettier expects LF. Run the formatting check
      # only where the checkout is LF.
      - run: pnpm run format:check
        if: runner.os == 'Linux'

      # gen-l10n rewrites bundle.l10n.json from source, so the diff check can
      # only run where the checkout is LF (see the formatting note above).
      - name: Verify l10n bundles are in sync with source
        run: pnpm run l10n:check
        if: runner.os == 'Linux'

      - name: Verify l10n locales are aligned
        run: pnpm run l10n:parity
        if: runner.os == 'Linux'

      - run: pnpm run lint

      # The backend lifecycle tests spawn stand-in processes and talk to
      # them over loopback HTTP, so they run on every supported platform.
      - run: pnpm run test:unit

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        shell: bash
        run: npm install -g pnpm

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go-backend/go.sum

      - run: pnpm run go:test
        name: Go tests

      - run: pnpm run go:vet
        name: Go vet

      - name: Cross-compile Windows amd64
        run: pnpm run go:build:win32-x64

      - name: Verify Windows amd64 binary
        run: file go-backend/bin/monitor.exe | grep -i "x86-64\|PE32"

      - name: Cross-compile Windows arm64
        run: pnpm run go:build:win32-arm64

      - name: Verify Windows arm64 binary
        run: file go-backend/bin/monitor.exe | grep -i "aarch64\|ARM64\|PE32"
