<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__';"
    />
    <style>
      :root {
        --bg: var(--vscode-sideBar-background);
        --fg: var(--vscode-editor-foreground);
        --fg-muted: var(--vscode-descriptionForeground);
        --border: var(--vscode-editorWidget-border);
        --font: var(
          --vscode-font-family,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif
        );
        --font-size: var(--vscode-font-size, 13px);
        --card-bg: var(--vscode-editor-background);
        --hover-bg: var(--vscode-list-hoverBackground);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scrollbar-width: none;
      }

      body {
        font-family: var(--font);
        font-size: var(--font-size);
        color: var(--fg);
        background: var(--bg);
        padding: 8px;
        overflow-x: hidden;
        user-select: none;
      }

      ::-webkit-scrollbar {
        display: none;
      }

      .card {
        background: var(--card-bg);
        border-radius: 4px;
        padding: 6px;
        margin-bottom: 6px;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 2px;
        font-size: calc(var(--font-size) - 1px);
        font-weight: 600;
        color: var(--fg-muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .card-left {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .card-value {
        font-weight: 700;
        font-size: calc(var(--font-size) - 1px);
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }

      .card-sub {
        font-size: calc(var(--font-size) - 2px);
        color: var(--fg-muted);
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
        margin-top: 1px;
        width: 100%;
      }

      .toggle-group {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
      }

      .toggle-btn {
        background: none;
        border: 1px solid transparent;
        color: var(--fg-muted);
        cursor: pointer;
        font-size: calc(var(--font-size) + 1px);
        line-height: 1;
        padding: 1px 4px;
        border-radius: 3px;
        opacity: 0.4;
      }

      .toggle-btn:hover {
        opacity: 0.8;
        background: var(--hover-bg);
      }

      .toggle-btn.active {
        opacity: 1;
        background: var(--card-bg);
        border-color: var(--border);
      }

      .chart-wrap {
        width: 100%;
        height: 56px;
        border: 1.5px solid
          color-mix(in srgb, var(--vscode-editor-foreground) 10%, transparent);
        border-radius: 4px;
      }

      body.vscode-high-contrast .chart-wrap {
        border-color: var(--vscode-contrastBorder);
      }

      .chart-wrap canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .bar-wrap {
        width: 100%;
        padding: 6px 0;
      }

      .bar-row {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .bar-track {
        flex: 1;
        height: 6px;
        background: rgba(128, 128, 128, 0.12);
        border-radius: 3px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: 3px;
        min-width: 2px;
      }

      .bar-label {
        font-size: calc(var(--font-size) - 2px);
        color: var(--fg-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .array-wrap {
        width: 100%;
        padding: 6px 0;
      }

      .core-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 4px 8px;
      }

      .core-cell {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }

      .core-name {
        font-size: calc(var(--font-size) - 2px);
        color: var(--fg-muted);
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
        min-width: 24px;
        text-align: right;
      }

      .core-bar-track {
        flex: 1;
        height: 6px;
        background: rgba(128, 128, 128, 0.12);
        border-radius: 3px;
        overflow: hidden;
        min-width: 0;
      }

      .core-bar-fill {
        height: 100%;
        border-radius: 3px;
        min-width: 2px;
      }

      .core-label {
        font-size: calc(var(--font-size) - 2px);
        color: var(--fg-muted);
        font-variant-numeric: tabular-nums;
        flex-shrink: 0;
        min-width: 30px;
        text-align: right;
      }

      .info-card {
        background: var(--card-bg);
        border-radius: 4px;
        padding: 8px 10px;
        margin-bottom: 6px;
      }

      .info-header {
        font-size: calc(var(--font-size) - 1px);
        font-weight: 600;
        color: var(--fg-muted);
        text-transform: uppercase;
        letter-spacing: 0.3px;
        margin-bottom: 4px;
      }

      /* The title strip is the only place a card may be dragged from. The card
         root stays draggable so the pointer is already inside a drag source when
         the gesture starts; the strip only has to look and behave like a handle. */
      .card-header,
      .info-header {
        cursor: grab;
      }

      /* The grip hangs on the label's own box, so that box is the positioning
         context for the pseudo-element below: for info cards the title is the
         header itself, for charts it is the label's own span. A block box paints
         its pseudo-element against itself, which is why the dots then follow the
         text box wherever the font puts it — no measured offset, no bookkeeping. */
      .card-header .card-left > span:first-child,
      .info-header {
        position: relative;
      }

      .card-header .card-left > span:first-child::before,
      .info-header::before {
        content: "";
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 4px;
        height: 9px;
        background-image: radial-gradient(currentColor 1px, transparent 1.3px);
        background-size: 4px 3px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms linear;
      }

      .card-header .card-left > span:first-child::before {
        left: -5px;
      }

      .info-header::before {
        left: -7px;
      }

      /* The whole title strip starts a drag, so the dots show whenever the pointer
         is anywhere over it rather than only over the text. */
      .card-header:hover .card-left > span:first-child::before,
      .info-header:hover::before {
        opacity: 0.6;
      }

      /* Drag feedback lives outside the box: opacity and box-shadow never move a
         card, so the pointer keeps pointing at the same pixels while ordering. */
      .dragging {
        opacity: 0.45;
        cursor: grabbing;
      }

      .drop-before {
        box-shadow: 0 -2px 0 0
          var(--vscode-focusBorder, var(--vscode-editor-foreground));
      }

      .drop-after {
        box-shadow: 0 2px 0 0
          var(--vscode-focusBorder, var(--vscode-editor-foreground));
      }

      .info-value {
        font-weight: 700;
        font-size: var(--font-size);
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }

      .info-mount-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 3px;
      }

      .info-mount-name {
        font-size: calc(var(--font-size) - 2px);
        color: var(--fg-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 30%;
        flex-shrink: 1;
        min-width: 0;
      }

      .info-bar-track {
        flex: 1;
        height: 6px;
        background: rgba(128, 128, 128, 0.12);
        border-radius: 3px;
        overflow: hidden;
      }

      .info-bar-fill {
        height: 100%;
        border-radius: 3px;
        min-width: 2px;
      }

      .info-bar-label {
        font-size: calc(var(--font-size) - 2px);
        color: var(--fg-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        flex-shrink: 0;
        min-width: 36px;
        text-align: right;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <script nonce="__NONCE__">
      (function () {
        "use strict";

        const vscode = acquireVsCodeApi();

        // -------- state --------

        // The extension's card sequence: it is both the render order and the
        // label source, so the view keeps no card vocabulary of its own.
        let _cards = [];
        let _chartColors = {};
        // Capacity words for the disk card's hover text (used/total/free).
        // They describe one mount row, not a card, so they travel with the
        // config instead of inside the card entries.
        let _capacityWords = {};
        let _diskSpaceMounts = ["all"];
        let _powerMode = "battery"; // "battery" (signed) | "soc" (mactop, always non-negative)

        // The last data frame the extension sent, kept so a config-driven rebuild
        // can repaint in the same frame instead of showing placeholders until the
        // next sample. null until the first frame arrives: a freshly opened panel
        // has nothing to replay and must keep its placeholders.
        let _lastUpdate = null;

        let _fmtConfig = {
          unitSystem: "binary",
          showSpace: false,
          significantDigits: {},
        };

        const ARRAY_TEMP_MAX = 110;

        const state = {
          viewMode: {},
          history: {},
          barMax: {},
          coreData: {},
          // Extension-provided per-card metadata (model / memText) for the
          // GPU array view, keyed by chart id.
          cardMeta: {},
          textMetrics: null,
        };

        // -------- color resolution --------

        var _cssCache = {};

        function resolveColorValue(val) {
          if (!val) return "";
          if (val.startsWith("--")) {
            if (_cssCache[val] === undefined) {
              _cssCache[val] = getComputedStyle(document.documentElement)
                .getPropertyValue(val)
                .trim();
            }
            return _cssCache[val];
          }
          return val;
        }

        function resetCSSCache() {
          _cssCache = {};
        }

        function getCachedCSSVar(name) {
          if (_cssCache[name] === undefined) {
            _cssCache[name] = getComputedStyle(document.documentElement)
              .getPropertyValue(name)
              .trim();
          }
          return _cssCache[name];
        }

        var _themeObserver = new MutationObserver(function () {
          resetCSSCache();
          for (const card of enabledChartCards()) {
            const id = card.id;
            if (
              state.viewMode[id] === "line" &&
              state.history[id] &&
              state.history[id].length >= 2
            ) {
              drawChart(id, state.history[id], colorFor(id));
            } else if (
              state.viewMode[id] === "array" &&
              state.coreData[id] &&
              state.coreData[id].length > 0
            ) {
              renderCoreArray(id, state.coreData[id]);
            }
          }
        });
        _themeObserver.observe(document.body, {
          attributes: true,
          attributeFilter: ["class"],
        });

        function hexToRgb(hex) {
          const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
          return m
            ? {
                r: parseInt(m[1], 16),
                g: parseInt(m[2], 16),
                b: parseInt(m[3], 16),
              }
            : null;
        }

        // VS Code injects theme colors that carry transparency (e.g.
        // charts.orange defaults to a translucent find-match highlight) as
        // "rgba(r,g,b,a)". Chart lines must always be drawn opaque so they
        // stay readable on every theme, mirroring the other default chart
        // colors. Any other format (hex, rgb(), color-mix, empty) passes
        // through untouched.
        function opaque(color) {
          if (typeof color !== "string") return color;
          const m =
            /^rgba\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*[\d.]+\)$/.exec(
              color,
            );
          return m ? "rgb(" + m[1] + "," + m[2] + "," + m[3] + ")" : color;
        }

        function rgba(color, a) {
          const rgb = hexToRgb(color);
          return rgb
            ? "rgba(" + rgb.r + "," + rgb.g + "," + rgb.b + "," + a + ")"
            : "rgba(128,128,128," + a + ")";
        }

        // -------- formatting --------

        function unitLabel(units, i, suffix) {
          const u = units[i];
          if (_fmtConfig.singleUnit) return u[0] + suffix;
          return u + suffix;
        }

        function formatRate(v) {
          if (v < 1) return "0 B/s";
          const isBinary = _fmtConfig.unitSystem === "binary";
          const sp = _fmtConfig.showSpace ? " " : "";
          const divisor = isBinary ? 1024 : 1000;
          const units = isBinary
            ? ["B", "KiB", "MiB", "GiB", "TiB", "PiB"]
            : ["B", "kB", "MB", "GB", "TB", "PB"];
          let i = 0,
            val = v;
          while (val >= divisor && i < units.length - 1) {
            val /= divisor;
            i++;
          }
          const sig = _fmtConfig.significantDigits?.network ?? 3;
          return val.toPrecision(sig) + sp + unitLabel(units, i, "/s");
        }

        function formatBytes(v, sig) {
          if (v < 1) return "0 B";
          const isBinary = _fmtConfig.unitSystem === "binary";
          const sp = _fmtConfig.showSpace ? " " : "";
          const divisor = isBinary ? 1024 : 1000;
          const units = isBinary
            ? ["B", "KiB", "MiB", "GiB", "TiB", "PiB"]
            : ["B", "kB", "MB", "GB", "TB", "PB"];
          let i = 0,
            val = v;
          while (val >= divisor && i < units.length - 1) {
            val /= divisor;
            i++;
          }
          const s = sig != null ? val.toPrecision(sig) : val.toFixed(1);
          return s + sp + unitLabel(units, i, "");
        }

        function formatUptimeSimple(seconds) {
          const d = Math.floor(seconds / 86400);
          const h = Math.floor((seconds % 86400) / 3600);
          const m = Math.floor((seconds % 3600) / 60);
          const parts = [];
          if (d > 0) parts.push(d + "d");
          if (h > 0) parts.push(h + "h");
          parts.push(m + "m");
          return parts.join(" ");
        }

        const SCALE_HEADROOM = 1.0;

        function isPercentId(id) {
          return (
            id === "cpu" ||
            id === "memActive" ||
            id === "memUsed" ||
            id === "battery" ||
            id === "gpu" ||
            id === "gpuMem"
          );
        }

        function isPowerId(id) {
          return id === "batteryPower";
        }

        // Non-percentage metrics derive their scale from the collected data, so their
        // current scale must be displayed (unlike the fixed 0-100% scale).
        function isDynamicScaleId(id) {
          return !isPercentId(id);
        }

        // Battery net power in battery mode is signed, so the chart is symmetric
        // about zero; every other scale starts at zero.
        function hasSymmetricScale(id) {
          return isPowerId(id) && _powerMode === "battery";
        }

        // Single source of truth for a metric's scale maximum: drives the line chart
        // y-axis, the bar fill width, and the scale label on both views.
        function computeScaleMax(id, vals) {
          if (isPercentId(id)) return 100;
          const peak = hasSymmetricScale(id)
            ? Math.max(1, ...vals.map(Math.abs))
            : Math.max(1, ...vals);
          return peak * SCALE_HEADROOM;
        }

        function formatChartValue(id, v) {
          const sep = _fmtConfig.showSpace ? " " : "";
          if (isPowerId(id)) {
            const sign = hasSymmetricScale(id) && v >= 0 ? "+" : "";
            return sign + v.toFixed(1) + sep + "W";
          }
          if (id === "cpuTemp" || id === "gpuTemp")
            return v.toFixed(1) + sep + "\u00B0C";
          if (id === "cpuSpeed") return v.toFixed(2) + sep + "GHz";
          if (isPercentId(id)) return v.toFixed(1) + sep + "%";
          return formatRate(v);
        }

        // Marks scale labels on both views as the chart's current maximum scale,
        // rather than the latest value.
        const SCALE_LABEL_PREFIX = "\u2191 ";

        // Draw a chart label with a background halo for contrast. Value and
        // scale labels use identical formatting and share this path.
        function drawChartLabel(ctx, text, x, y, opts) {
          ctx.font = opts.font;
          ctx.textAlign = opts.align;
          ctx.textBaseline = "top";
          ctx.strokeStyle = opts.halo;
          ctx.lineWidth = 3;
          ctx.lineJoin = "round";
          ctx.strokeText(text, x, y);
          ctx.fillStyle = opts.color;
          ctx.fillText(text, x, y);
        }

        function colorFor(id) {
          const c = opaque(resolveColorValue(_chartColors[id]));
          if (c) return c;
          return getCachedCSSVar("--vscode-editor-foreground");
        }

        // -------- card ordering (drag and drop) --------

        // Reordering is a pointer-only gesture: there is no button or shortcut to
        // fall back on, so the gesture itself has to be reliable. Two rules shape
        // the code below: a drag may only start on a title strip, and cards are
        // moved as nodes instead of being re-rendered.

        // Only direct children of the container are cards: the toggle buttons
        // inside a chart card carry data-metric as well.
        function cardElements() {
          const container = document.getElementById("card-container");
          if (!container) return [];
          return Array.from(container.children).filter(function (el) {
            return el.dataset && el.dataset.metric;
          });
        }

        function isVisibleCard(el) {
          return el.getBoundingClientRect().height > 0;
        }

        // Null whenever no drag of ours is running; every handler below and the
        // config handler test it first.
        let _drag = null;
        // Card whose title strip received the last mousedown. dragstart is fired
        // at the draggable element itself rather than at the child under the
        // pointer, so "did this gesture start in the title area" can only be
        // recorded on press.
        let _dragOriginId = null;
        let _pointerY = 0;
        let _autoScrollRaf = null;
        // Which card the landing marker is currently drawn on, and on which side.
        // Remembering it keeps the marker (and the node move) off every dragover.
        let _dropMarkerKey = null;
        // One-shot guard for a click the browser may deliver right after a drop.
        let _swallowClick = false;

        // The panel's scrollbar is hidden entirely, so a drag that reaches the
        // edge of the viewport has to scroll the document itself or the cards
        // below the fold can never be passed. Scrolling continues while the
        // pointer stands still, which is why it is driven by frames instead of by
        // dragover.
        const AUTO_SCROLL_EDGE = 24;
        const AUTO_SCROLL_MAX_STEP = 18;

        function autoScrollStep() {
          _autoScrollRaf = null;
          if (!_drag) return;
          const height = window.innerHeight;
          let step = 0;
          if (_pointerY < AUTO_SCROLL_EDGE) {
            step = -Math.max(
              2,
              Math.round(
                ((AUTO_SCROLL_EDGE - _pointerY) / AUTO_SCROLL_EDGE) *
                  AUTO_SCROLL_MAX_STEP,
              ),
            );
          } else if (_pointerY > height - AUTO_SCROLL_EDGE) {
            step = Math.max(
              2,
              Math.round(
                ((_pointerY - (height - AUTO_SCROLL_EDGE)) / AUTO_SCROLL_EDGE) *
                  AUTO_SCROLL_MAX_STEP,
              ),
            );
          }
          if (step !== 0) {
            window.scrollBy(0, step);
            // The cards scrolled with the document, so the landing marker has to
            // be recomputed even though the pointer itself did not move.
            updateDropTarget(_pointerY, null);
          }
          _autoScrollRaf = requestAnimationFrame(autoScrollStep);
        }

        function startAutoScroll() {
          if (_autoScrollRaf === null) {
            _autoScrollRaf = requestAnimationFrame(autoScrollStep);
          }
        }

        function stopAutoScroll() {
          if (_autoScrollRaf !== null) {
            cancelAnimationFrame(_autoScrollRaf);
            _autoScrollRaf = null;
          }
        }

        // Where a release at `y` would drop the dragged card.
        //
        // The card under the pointer decides which side of its own vertical
        // midline the pointer is on: above goes before it, below goes after it.
        // The drag event's target is not always a card (a canvas, a toggle
        // button, the empty space below the last card), so when it does not
        // resolve to one, the same midline question is asked of every visible
        // card rather than guessed from the target.
        //
        // Hidden cards are skipped for the comparison but keep their place in the
        // document: they are only display:none, and shuffling them to match a
        // pointer that cannot reach them would rewrite an order the user cannot
        // see.
        function resolveDropPlace(y, eventTarget) {
          const container = document.getElementById("card-container");
          const dragged = _drag ? _drag.el : null;
          const under =
            eventTarget && eventTarget.closest
              ? eventTarget.closest("[data-metric]")
              : null;
          const target =
            under &&
            under !== dragged &&
            under.parentElement === container &&
            isVisibleCard(under)
              ? under
              : null;
          if (target) {
            const rect = target.getBoundingClientRect();
            return { card: target, after: y >= rect.top + rect.height / 2 };
          }

          const cards = cardElements().filter(function (el) {
            return el !== dragged && isVisibleCard(el);
          });
          if (cards.length === 0) return null;
          for (const el of cards) {
            const rect = el.getBoundingClientRect();
            if (y < rect.top + rect.height / 2) {
              return { card: el, after: false };
            }
          }
          return { card: cards[cards.length - 1], after: true };
        }

        // Follow the pointer with the card itself: the node is moved as soon as
        // the landing spot changes, so what the user sees while dragging is the
        // order they end up with. Waiting for a drop event instead would lose the
        // gesture, because the edge auto-scroll moves the page under a pointer
        // that has stopped producing dragover events, and the browser then treats
        // the release point as no drop target at all and fires only dragend.
        function updateDropTarget(y, eventTarget) {
          if (!_drag) return;
          const place = resolveDropPlace(y, eventTarget);
          const key = place
            ? (place.after ? "after:" : "before:") + place.card.dataset.metric
            : "";
          if (key === _dropMarkerKey) return;
          _dropMarkerKey = key;
          moveCard(_drag.el, place);
          for (const el of cardElements()) {
            el.classList.remove("drop-before", "drop-after");
          }
          if (place) {
            place.card.classList.add(
              place.after ? "drop-after" : "drop-before",
            );
          }
        }

        function moveCard(card, place) {
          const container = card.parentElement;
          if (!place || !container) return;
          // insertBefore moves the existing node, so the canvas keeps its bitmap
          // and the handles in _canvases stay valid; a re-render would replace
          // both and blank the chart until the next sample arrived.
          const anchor = place.after
            ? place.card.nextElementSibling
            : place.card;
          if (anchor === card) return;
          container.insertBefore(card, anchor);
        }

        // Report the order the drag left behind, read back from the document so it
        // also carries the cards that are currently hidden.
        function publishOrder() {
          // A drop can still be followed by a click on whatever the pointer was
          // over, typically a toggle button, which would switch a view nobody
          // asked for. The guard is armed here and disarmed by the next press.
          _swallowClick = true;
          vscode.postMessage({
            type: "setChartsOrder",
            order: cardElements().map(function (el) {
              return el.dataset.metric;
            }),
          });
        }

        function endDrag() {
          stopAutoScroll();
          if (_drag) {
            _drag.el.classList.remove("dragging");
          }
          _drag = null;
          _dragOriginId = null;
          _dropMarkerKey = null;
          for (const el of cardElements()) {
            el.classList.remove("drop-before", "drop-after");
          }
        }

        document.addEventListener("mousedown", function (e) {
          // A fresh press starts a new gesture, and the click guard must never
          // outlive the drop it was armed for.
          _swallowClick = false;
          const handle = e.target.closest("[data-drag-handle]");
          const card = handle ? handle.closest("[data-metric]") : null;
          // A press on a toggle button is a view switch even though the buttons
          // sit inside the title strip.
          _dragOriginId =
            card && !e.target.closest(".toggle-btn")
              ? card.dataset.metric
              : null;
        });

        document.addEventListener("mouseup", function () {
          _dragOriginId = null;
        });

        document.addEventListener("dragstart", function (e) {
          const card = e.target.closest("[data-metric]");
          if (!card || _drag || card.dataset.metric !== _dragOriginId) {
            // The rest of the card is draggable at the DOM level only so that a
            // press inside the title strip already sits in a drag source; a drag
            // that begins anywhere else means nothing to the ordering.
            e.preventDefault();
            return;
          }
          e.dataTransfer.effectAllowed = "move";
          // Chromium aborts a drag that carries no payload before the first
          // dragover ever fires.
          e.dataTransfer.setData("text/plain", card.dataset.metric);
          _drag = { el: card };
          _pointerY = e.clientY;
          card.classList.add("dragging");
          startAutoScroll();
          updateDropTarget(e.clientY, e.target);
        });

        document.addEventListener("dragover", function (e) {
          if (!_drag) return;
          // Every dragover has to be cancelled, otherwise the browser treats the
          // element as a non-target and never delivers drop.
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          _pointerY = e.clientY;
          updateDropTarget(e.clientY, e.target);
        });

        document.addEventListener("drop", function (e) {
          if (!_drag) return;
          // Claim the drop so the browser runs no default action of its own (the
          // card is already where it belongs); the order is reported on dragend,
          // which fires whether or not this event did.
          e.preventDefault();
        });

        document.addEventListener("dragend", function () {
          if (_drag) {
            publishOrder();
          }
          endDrag();
        });

        document.addEventListener(
          "click",
          function (e) {
            if (!_swallowClick) return;
            _swallowClick = false;
            e.preventDefault();
            e.stopPropagation();
          },
          true,
        );

        // -------- config handler --------

        function handleConfig(cfg) {
          // A rebuild replaces every node this drag points at, so a config message
          // that arrives mid-drag ends the gesture instead of letting it continue
          // on detached elements.
          endDrag();
          resetCSSCache();
          _cards = Array.isArray(cfg.cards) ? cfg.cards : [];
          _capacityWords = cfg.labels || {};
          _diskSpaceMounts = cfg.diskSpaceMounts || ["all"];
          _powerMode = cfg.powerMode || "battery";

          _chartColors = {};
          for (const card of _cards) {
            _chartColors[card.id] = card.color || "";
          }

          // Only charts carry per-card drawing state. The view mode is reset to
          // the configured default on every config message, so a settings
          // change reaches an already open view.
          for (const card of enabledChartCards()) {
            const id = card.id;
            state.viewMode[id] = card.view || "line";
            if (!state.history[id]) state.history[id] = [];
            state.barMax[id] = state.barMax[id] || 1;
          }

          renderCards();

          // A rebuild starts every card from its placeholder markup, so without
          // this replay the panel shows an empty frame (and a height jump) until
          // the next sample arrives. Replaying the last frame is not a second
          // render path: it is the handler the data messages already go through.
          if (_lastUpdate) {
            handleUpdate(
              _lastUpdate.data,
              _lastUpdate.formattedText,
              _lastUpdate.unavailableMetrics,
            );
          }
        }

        // -------- render --------

        // One container, one sequence: the card array decides what exists and
        // in which order it appears. Charts get their canvas and bar handles
        // registered after the markup lands; text and disk cards need no
        // registration because later messages address them by id.
        function renderCards() {
          const container = document.getElementById("card-container");
          if (!container) return;

          let html = "";
          for (const card of _cards) {
            if (!card.enabled) continue;
            html +=
              card.kind === "chart" ? chartCardHtml(card) : infoCardHtml(card);
          }
          container.innerHTML = html;

          for (const card of enabledChartCards()) {
            const id = card.id;
            const canvas = document.getElementById("canvas-" + id);
            const chartWrap = document.getElementById("chart-wrap-" + id);
            if (canvas) registerCanvas(id, canvas, chartWrap);
            const barFill = document.getElementById("bar-fill-" + id);
            const barLabel = document.getElementById("bar-label-" + id);
            const valEl = document.getElementById("val-" + id);
            if (barFill) registerBar(id, barFill, barLabel, valEl);
          }
        }

        function enabledChartCards() {
          return _cards.filter((card) => card.kind === "chart" && card.enabled);
        }

        function chartCardHtml(card) {
          const id = card.id;
          const color = colorFor(id);
          const view = state.viewMode[id] || "line";
          const isArrayCapable = card.array !== undefined;
          // GPU arrays only make sense with more than one card; a
          // single (e.g. Apple Silicon) GPU has no array dimension.
          const coreCount = state.coreData[id] ? state.coreData[id].length : 0;
          const hasCores =
            isArrayCapable && coreCount > (id.startsWith("gpu") ? 1 : 0);

          return (
            '<div class="card" data-metric="' +
            id +
            '" draggable="true">' +
            '<div class="card-header" data-drag-handle>' +
            '<div class="card-left">' +
            "<span>" +
            card.label +
            "</span>" +
            '<span class="card-value" id="val-' +
            id +
            '">\u2014</span>' +
            '<div class="card-sub" id="sub-' +
            id +
            '"></div>' +
            "</div>" +
            '<div class="toggle-group">' +
            '<button class="toggle-btn' +
            (view === "line" ? " active" : "") +
            '" data-metric="' +
            id +
            '" data-view="line" title="__LINE_CHART_TITLE__">\u25E0</button>' +
            '<button class="toggle-btn' +
            (view === "bar" ? " active" : "") +
            '" data-metric="' +
            id +
            '" data-view="bar" title="__BAR_CHART_TITLE__">\u25A4</button>' +
            (isArrayCapable
              ? '<button class="toggle-btn' +
                (view === "array" ? " active" : "") +
                '" data-metric="' +
                id +
                '" data-view="array" title="__ARRAY_CHART_TITLE__" style="display:' +
                (hasCores ? "" : "none") +
                '">\u25A6</button>'
              : "") +
            "</div>" +
            "</div>" +
            '<div class="chart-wrap" id="chart-wrap-' +
            id +
            '"' +
            (view !== "line" ? ' style="display:none"' : "") +
            ">" +
            '<canvas id="canvas-' +
            id +
            '"></canvas>' +
            "</div>" +
            '<div class="bar-wrap" id="bar-wrap-' +
            id +
            '"' +
            (view !== "bar" ? ' style="display:none"' : "") +
            ">" +
            '<div class="bar-row">' +
            '<div class="bar-track"><div class="bar-fill" id="bar-fill-' +
            id +
            '" style="width:0%;background:' +
            color +
            '"></div></div>' +
            '<span class="bar-label" id="bar-label-' +
            id +
            '">\u2014</span>' +
            "</div>" +
            "</div>" +
            (isArrayCapable
              ? '<div class="array-wrap" id="array-wrap-' +
                id +
                '"' +
                (view !== "array" ? ' style="display:none"' : "") +
                "></div>"
              : "") +
            "</div>"
          );
        }

        // Text and disk cards keep their own two-line shell: they print a
        // value rather than drawing it, and the chart card's header would
        // inherit its uppercase styling onto that value. data-metric is what
        // the merged sequence needs from them, so it is on the card itself.
        function infoCardHtml(card) {
          const id = card.id;
          const header =
            '<div class="info-header" data-drag-handle>' +
            card.label +
            "</div>";

          if (card.kind === "disk") {
            return (
              '<div class="info-card" data-metric="' +
              id +
              '" draggable="true">' +
              header +
              // The mount rows are rebuilt from every data frame, so they keep
              // a list of their own instead of being part of the header.
              '<div id="disk-mount-list"></div>' +
              "</div>"
            );
          }
          return (
            '<div class="info-card" data-metric="' +
            id +
            '" draggable="true">' +
            header +
            '<div class="info-value" id="val-' +
            id +
            '">\u2014</div>' +
            "</div>"
          );
        }

        const _canvases = {};
        const _chartWraps = {};
        const _barFills = {};
        const _barLabels = {};
        const _valueEls = {};
        const _resizeObserved = new Set();

        function registerCanvas(id, canvas, wrap) {
          _canvases[id] = canvas;
          _chartWraps[id] = wrap;
          if (!_resizeObserved.has(id)) {
            _resizeObserved.add(id);
            if (_resizeObserver) _resizeObserver.observe(canvas);
          }
        }

        function registerBar(id, fill, label, valEl) {
          _barFills[id] = fill;
          _barLabels[id] = label;
          _valueEls[id] = valEl;
        }

        // -------- disk space bar helpers --------

        // Shared traffic-light semantics for percentage bars: green below
        // 60%, yellow from 60%, red from 80%. Used by disk mounts and the
        // per-core CPU array view.
        function usageColor(pct) {
          const name =
            pct >= 80
              ? "--vscode-charts-red"
              : pct >= 60
                ? "--vscode-charts-yellow"
                : "--vscode-charts-green";
          return opaque(resolveColorValue(name)) || colorFor("memActive");
        }

        // Temperature color bands (CPU and GPU): green below 65°C, yellow
        // 65-85°C, red above 85°C. Kept distinct from usageColor because the
        // threshold semantics differ (absolute thermal limits vs. usage).
        function tempColor(temp) {
          const name =
            temp >= 85
              ? "--vscode-charts-red"
              : temp >= 65
                ? "--vscode-charts-yellow"
                : "--vscode-charts-green";
          return opaque(resolveColorValue(name)) || colorFor("memActive");
        }

        // The disk card is the only place rendering byte capacities, so its
        // precision rule lives here instead of being repeated per caller.
        // Falls back to 3 like the sibling formatters (fmtPct / the network
        // rate formatter) when the user's configuration omits diskSpace.
        function diskByte(v) {
          const sig = _fmtConfig.significantDigits?.diskSpace ?? 3;
          return formatBytes(v, sig);
        }

        // Hover text for one mount row. The name cell truncates long paths
        // (max-width 30%), so the full mount point is repeated here. The
        // extension supplies the localized Used / Total / Free words; the
        // fallbacks keep the row readable if an older host sends none.
        function diskMountTip(m) {
          // Literal spaces, not _fmtConfig.showSpace: that setting controls the
          // gap between a number and its unit (inside formatBytes), not how the
          // localized words are separated from the figures they label.
          // Prefer the filesystem's own available figure (df's Avail): with
          // ext4 reserved blocks and on btrfs/zfs/APFS pools it differs from
          // size - used. The subtraction remains only as a fallback.
          const free = Math.max(
            0,
            Number.isFinite(m.available) ? m.available : m.size - m.used,
          );
          return (
            m.mount +
            " \u00B7 " +
            (_capacityWords.used || "Used") +
            " " +
            diskByte(m.used) +
            " / " +
            (_capacityWords.total || "Total") +
            " " +
            diskByte(m.size) +
            " (" +
            m.use +
            "%) \u00B7 " +
            (_capacityWords.free || "Free") +
            " " +
            diskByte(free)
          );
        }

        function renderDiskMountBars(mounts) {
          const container = document.getElementById("disk-mount-list");
          if (!container) return;
          if (!mounts || mounts.length === 0) {
            container.innerHTML =
              '<div class="info-value" style="font-size:calc(var(--font-size)-1px)">\u2014</div>';
            return;
          }

          // The total row is labelled with the card's own title; the view
          // keeps no copy of it.
          const diskCard = _cards.find((c) => c.kind === "disk");
          const diskLabel = diskCard ? diskCard.label : "";

          const isAll =
            _diskSpaceMounts.length === 1 && _diskSpaceMounts[0] === "all";
          const filtered = isAll
            ? mounts
            : mounts.filter((m) => _diskSpaceMounts.includes(m.mount));

          let html = "";
          for (const m of filtered) {
            const barColor = usageColor(m.use);
            const tip = diskMountTip(m);
            // The tooltip sits on the whole row (name, bar, percentage) so the
            // narrow bar stays easy to hover; the name cell intentionally has
            // no title of its own, otherwise it would shadow the row's.
            html +=
              '<div class="info-mount-row" title="' +
              escHtml(tip) +
              '">' +
              '<span class="info-mount-name">' +
              escHtml(m.mount) +
              "</span>" +
              '<div class="info-bar-track"><div class="info-bar-fill" style="width:' +
              m.use +
              "%;background:" +
              barColor +
              '"></div></div>' +
              '<span class="info-bar-label">' +
              m.use +
              "%</span>" +
              "</div>";
          }
          const totalSize = filtered.reduce((s, m) => s + m.size, 0);
          const totalUsed = filtered.reduce((s, m) => s + m.used, 0);
          const totalPct =
            totalSize > 0 ? ((totalUsed / totalSize) * 100).toFixed(1) : "0";
          const sp2 = _fmtConfig.showSpace ? " " : "";
          html +=
            '<div class="info-mount-row" style="margin-top:6px;border-top:1px solid rgba(128,128,128,0.15);padding-top:4px">' +
            '<span class="info-mount-name" style="font-weight:600">' +
            diskLabel +
            "</span>" +
            '<span class="info-bar-label" style="font-weight:600;color:var(--fg)">' +
            diskByte(totalUsed) +
            sp2 +
            "/" +
            sp2 +
            diskByte(totalSize) +
            sp2 +
            "(" +
            totalPct +
            "%)</span>" +
            "</div>";
          container.innerHTML = html;
        }

        // Escapes a value for an HTML attribute. The DOM round-trip only covers
        // & < >, so the double quote is appended here: every caller today
        // interpolates into a title attribute, and an unescaped quote would
        // close the attribute early (mount points may legitimately contain one).
        function escHtml(s) {
          const d = document.createElement("div");
          d.textContent = s;
          return d.innerHTML.replace(/"/g, "&quot;");
        }

        // -------- view toggle --------

        // Reflect a view mode in the toggle group's active states.
        function setViewActive(id, view) {
          const card = document.querySelector(
            '.card[data-metric="' + id + '"]',
          );
          if (!card) return;
          for (const btn of card.querySelectorAll(".toggle-btn")) {
            btn.classList.toggle("active", btn.dataset.view === view);
          }
        }

        document.addEventListener("click", function (e) {
          const btn = e.target.closest(".toggle-btn");
          if (!btn) return;
          const metric = btn.dataset.metric;
          const view = btn.dataset.view;
          if (!metric || !view) return;

          state.viewMode[metric] = view;
          setViewActive(metric, view);

          // The view a user picks is a preference, so it is written back as the
          // card's default and survives reopening the panel. The per-item view
          // is the exception: whether it exists at all depends on the data (a
          // single GPU has no per-item dimension), so persisting it would pin a
          // default that some machines cannot honor. Only line and bar travel
          // to the extension; the per-item view stays a per-session choice.
          if (view === "line" || view === "bar") {
            vscode.postMessage({ type: "setCardView", id: metric, view: view });
          }

          const chartWrap = document.getElementById("chart-wrap-" + metric);
          const barWrap = document.getElementById("bar-wrap-" + metric);
          const arrayWrap = document.getElementById("array-wrap-" + metric);
          if (chartWrap)
            chartWrap.style.display = view === "line" ? "" : "none";
          if (barWrap) barWrap.style.display = view === "bar" ? "" : "none";
          if (arrayWrap)
            arrayWrap.style.display = view === "array" ? "" : "none";

          if (view === "bar") {
            updateBar(metric);
          } else if (view === "array") {
            renderCoreArray(metric);
          } else if (
            state.history[metric] &&
            state.history[metric].length >= 2
          ) {
            drawChart(metric, state.history[metric], colorFor(metric));
          }
        });

        // -------- data helpers --------

        // Current per-item values for the array view (e.g. per-core CPU
        // usage), or [] when the metric has no per-item dimension or the
        // active data source does not provide one. Platform support is
        // therefore expressed by data presence, never by a platform check.
        function extractArray(history, array) {
          if (!array || !history || !history.length) return [];
          const arr = history[history.length - 1][array.field];
          return Array.isArray(arr) ? arr : [];
        }

        function extractHistory(history, id) {
          const vals = [];
          for (const dp of history) {
            let v;
            if (id === "cpu") v = dp.cpu;
            else if (id === "memActive")
              v = (dp.memoryActive / dp.memoryTotal) * 100;
            else if (id === "memUsed")
              v = (dp.memoryUsed / dp.memoryTotal) * 100;
            else if (id === "netRx") v = dp.networkRx;
            else if (id === "netTx") v = dp.networkTx;
            else if (id === "diskRx") v = dp.diskRx;
            else if (id === "diskWx") v = dp.diskWx;
            else if (id === "battery")
              v = dp.batteryPercent >= 0 ? dp.batteryPercent : 0;
            else if (id === "batteryPower") v = dp.batteryPower;
            else if (id === "cpuTemp") v = dp.cpuTemperature;
            else if (id === "cpuSpeed") v = dp.cpuSpeedAvg;
            else if (id === "gpu") v = dp.gpuUtilization;
            else if (id === "gpuTemp") v = dp.gpuTemperature;
            else if (id === "gpuMem")
              v =
                dp.gpuMemTotal > 0 ? (dp.gpuMemUsed / dp.gpuMemTotal) * 100 : 0;
            else v = 0;
            vals.push(v);
          }
          return vals;
        }

        // -------- line chart drawing --------

        function drawChart(id, history, color) {
          const canvas = _canvases[id];
          if (!canvas) return;
          const ctx = canvas.getContext("2d");
          const rect = canvas.getBoundingClientRect();
          const dpr = window.devicePixelRatio || 1;
          const w = rect.width;
          const h = rect.height;
          if (w === 0 || h === 0) return;

          canvas.width = w * dpr;
          canvas.height = h * dpr;
          ctx.scale(dpr, dpr);
          ctx.clearRect(0, 0, w, h);

          const padTop = 0,
            padBot = 0;
          const drawH = h - padTop - padBot;

          const dataMax = computeScaleMax(id, history);
          const dataMin = hasSymmetricScale(id) ? -dataMax : 0;
          const range = dataMax - dataMin;
          const n = history.length;
          if (n < 2) return;

          function yPos(val) {
            return padTop + drawH - ((val - dataMin) / range) * drawH;
          }

          const xStep = w / (n - 1);

          const fg = getCachedCSSVar("--vscode-editor-foreground");
          const bg = getCachedCSSVar("--vscode-editor-background");

          // Area fill blends the line color toward the card background in
          // oklab, so light colors keep their hue instead of going gray at
          // low alpha. Falls back to plain alpha if the background var is
          // unexpectedly missing.
          const grad = ctx.createLinearGradient(0, padTop, 0, padTop + drawH);
          grad.addColorStop(
            0,
            bg
              ? "color-mix(in oklab, " + color + " 30%, " + bg + ")"
              : rgba(color, 0.3),
          );
          grad.addColorStop(
            1,
            bg
              ? "color-mix(in oklab, " + color + " 10%, " + bg + ")"
              : rgba(color, 0.1),
          );
          ctx.beginPath();
          curvePath(ctx, history, xStep, yPos);
          ctx.lineTo((n - 1) * xStep, padTop + drawH);
          ctx.lineTo(0, padTop + drawH);
          ctx.closePath();
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.strokeStyle = rgba(fg, 0.1);
          ctx.lineWidth = 1.5;
          for (let i = 1; i <= 3; i++) {
            const y = padTop + (drawH / 4) * i;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }

          if (hasSymmetricScale(id)) {
            const yZero = yPos(0);
            ctx.strokeStyle = rgba(fg, 0.2);
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(0, yZero);
            ctx.lineTo(w, yZero);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          ctx.beginPath();
          curvePath(ctx, history, xStep, yPos);
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.8;
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          ctx.stroke();

          const last = history[n - 1];
          const label = formatChartValue(id, last);

          const font =
            "bold " +
            Math.round(h * 0.24) +
            "px var(--vscode-font-family, sans-serif)";

          drawChartLabel(ctx, label, w - 2, padTop + 2, {
            font,
            align: "right",
            color,
            halo: bg,
          });

          if (isDynamicScaleId(id)) {
            const scaleLabel =
              SCALE_LABEL_PREFIX + formatChartValue(id, dataMax);
            drawChartLabel(ctx, scaleLabel, 2, padTop + 2, {
              font,
              align: "left",
              color,
              halo: bg,
            });
          }
        }

        function curvePath(ctx, data, xStep, yPos) {
          const n = data.length;
          ctx.moveTo(0, yPos(data[0]));
          for (let i = 1; i < n - 1; i++) {
            const mx = (i * xStep + (i + 1) * xStep) / 2;
            const my = (yPos(data[i]) + yPos(data[i + 1])) / 2;
            ctx.quadraticCurveTo(i * xStep, yPos(data[i]), mx, my);
          }
          ctx.lineTo((n - 1) * xStep, yPos(data[n - 1]));
        }

        // -------- bar updates --------

        function updateArrayButton(id, show) {
          const btn = document.querySelector(
            '.toggle-btn[data-metric="' + id + '"][data-view="array"]',
          );
          if (btn) btn.style.display = show ? "" : "none";
        }

        // The array metadata arrives with each card entry, so callers that only
        // know a card id (click handler, theme and resize redraws) resolve it
        // through the sequence instead of a second table.
        function arrayMeta(id) {
          const card = _cards.find((c) => c.id === id);
          return card ? card.array : undefined;
        }

        // Renders the array view: a responsive grid of per-item horizontal
        // bars (CSS auto-fill grows the column count with the card width).
        // Three cell types are supported via the card's array metadata:
        //   percent - value is 0-100; width = value, label = "%"
        //   temp    - fixed 0-110 scale; width clamps, label always shows
        //             the real °C value (never lies even above the bound)
        //   mem     - per-card used/total percent; label = "%", tooltip =
        //             model + byte-formatted used/total (from the extension)
        function renderCoreArray(id, cores) {
          cores = cores || state.coreData[id] || [];
          const wrap = document.getElementById("array-wrap-" + id);
          if (!wrap || cores.length === 0) return;

          const cfg = arrayMeta(id) || {};
          const meta = state.cardMeta[id] || [];
          const isObj = cfg.valueKey !== undefined;

          const cell = (i, item) => {
            let value = isObj ? item[cfg.valueKey] : item;
            if (cfg.type === "mem" && isObj) {
              const total = item.memTotal || 0;
              value = total > 0 ? (item.memUsed / total) * 100 : 0;
            }
            value = Number.isFinite(value) ? value : 0;

            let pct, label, color, tooltip;
            if (cfg.type === "temp") {
              pct = Math.max(0, Math.min(100, (value / ARRAY_TEMP_MAX) * 100));
              label = Math.round(value) + "\u00B0C";
              color = tempColor(value);
              tooltip = isObj ? meta[i]?.model || "" : "";
            } else {
              pct = Math.max(0, Math.min(100, value));
              label = Math.round(value) + "%";
              color = usageColor(value);
              tooltip = isObj
                ? cfg.type === "mem"
                  ? (meta[i]?.model || "") +
                    (meta[i]?.memText ? " \u00B7 " + meta[i].memText : "")
                  : meta[i]?.model || ""
                : "";
            }
            const name = cfg.prefix + i;
            return (
              '<div class="core-cell"' +
              (tooltip ? ' title="' + escHtml(tooltip) + '"' : "") +
              ">" +
              '<span class="core-name">' +
              name +
              "</span>" +
              '<div class="core-bar-track"><div class="core-bar-fill" style="width:' +
              pct +
              "%;background:" +
              color +
              '"></div></div>' +
              '<span class="core-label">' +
              label +
              "</span>" +
              "</div>"
            );
          };

          let html = '<div class="core-grid">';
          for (let i = 0; i < cores.length; i++) {
            html += cell(i, cores[i]);
          }
          html += "</div>";
          wrap.innerHTML = html;
        }

        function updateBar(id) {
          const fill = _barFills[id];
          if (fill) fill.style.width = getBarPercent(id) + "%";
          const label = _barLabels[id];
          if (!label) return;
          label.textContent = isDynamicScaleId(id)
            ? SCALE_LABEL_PREFIX + formatChartValue(id, state.barMax[id] || 1)
            : "100%";
        }

        function getBarPercent(id) {
          const hist = state.history[id];
          const val = hist && hist.length > 0 ? hist[hist.length - 1] : 0;
          const maxVal = state.barMax[id] || 1;
          if (maxVal <= 0) return 0;
          return Math.max(0, Math.min(100, (val / maxVal) * 100));
        }

        // -------- handle data --------

        function handleUpdate(data, formattedText, unavailableMetrics) {
          const h = data.history;
          if (!h || h.length < 1) return;

          const fmt = data.formatted;
          if (data.formatConfig) _fmtConfig = data.formatConfig;

          const tm = data.textMetrics;

          // Every card is toggled each frame, not just hidden: a metric that is
          // briefly unavailable (a first sample of 0, a transient nvidia-smi
          // timeout) must come back once it reports a value, or the card stays
          // hidden for the rest of the view's lifetime.
          const hidden = new Set(unavailableMetrics || []);
          for (const card of document.querySelectorAll(
            ".card[data-metric], .info-card[data-metric]",
          )) {
            card.style.display = hidden.has(card.dataset.metric) ? "none" : "";
          }

          // Per-card GPU metadata (model / byte-formatted memText) for
          // array view tooltips; provided by the extension.
          try {
            const gpuMeta = JSON.parse((formattedText || {}).gpuCards || "[]");
            for (const id of ["gpu", "gpuTemp", "gpuMem"]) {
              state.cardMeta[id] = gpuMeta;
            }
          } catch {
            /* ignore malformed metadata */
          }

          for (const card of enabledChartCards()) {
            const id = card.id;
            if (hidden.has(id)) continue;

            state.history[id] = extractHistory(h, id);
            state.barMax[id] = computeScaleMax(id, state.history[id]);

            const cores = extractArray(h, card.array);
            state.coreData[id] = cores;
            // GPU arrays (gpu/gpuTemp/gpuMem) only make sense with more
            // than one card: a single (e.g. Apple Silicon) GPU would
            // otherwise surface a pointless G0 array row.
            updateArrayButton(
              id,
              cores.length > (id.startsWith("gpu") ? 1 : 0),
            );

            const valEl = document.getElementById("val-" + id);
            if (valEl) valEl.textContent = fmt[id] || "\u2014";

            // subtitles
            const subEl = document.getElementById("sub-" + id);
            if (subEl) {
              subEl.textContent = (formattedText || {})[id + "Sub"] || "";
            }

            if (state.viewMode[id] === "array") {
              if (cores.length > (id.startsWith("gpu") ? 1 : 0)) {
                renderCoreArray(id, cores);
              } else {
                // Per-item data became unavailable (e.g. data source
                // switch, or a single GPU without an array dimension);
                // fall back to the line view.
                state.viewMode[id] = "line";
                setViewActive(id, "line");
                const chartWrap = document.getElementById("chart-wrap-" + id);
                const arrayWrap = document.getElementById("array-wrap-" + id);
                if (chartWrap) chartWrap.style.display = "";
                if (arrayWrap) arrayWrap.style.display = "none";
                if (state.history[id].length >= 2) {
                  drawChart(id, state.history[id], colorFor(id));
                }
              }
            } else if (state.viewMode[id] === "line") {
              drawChart(id, state.history[id], colorFor(id));
            } else {
              updateBar(id);
            }
          }

          if (tm) {
            state.textMetrics = tm;
            updateTextMetrics(tm, formattedText);
          }
        }

        function updateTextMetrics(tm, formattedText) {
          const ft = formattedText || {};

          const uptimeVal = document.getElementById("val-uptime");
          if (uptimeVal)
            uptimeVal.textContent = ft.uptime || formatUptimeSimple(tm.uptime);

          const distroVal = document.getElementById("val-osDistro");
          if (distroVal)
            distroVal.textContent = ft.osDistro || tm.osDistro || "N/A";

          if (tm.diskSpace) {
            renderDiskMountBars(tm.diskSpace);
          }
        }

        // -------- message handler --------

        window.addEventListener("message", function (e) {
          const msg = e.data;
          if (msg.type === "config" && msg.data) {
            handleConfig(msg.data);
          } else if (msg.type === "update" && msg.data) {
            // Remember the parts a rebuild needs, so the config handler can
            // replay this exact frame instead of waiting for the next one.
            _lastUpdate = {
              data: msg.data,
              formattedText: msg.formattedText,
              unavailableMetrics: msg.unavailableMetrics,
            };
            handleUpdate(msg.data, msg.formattedText, msg.unavailableMetrics);
          }
        });

        // -------- resize observer --------

        // Throttle redraws with requestAnimationFrame so a burst of resize
        // notifications (window resize / sidebar drag) collapses to at most
        // one redraw per frame, preventing main-thread jank.
        let _rafId = null;
        const _resizeObserver = new ResizeObserver(function () {
          if (_rafId !== null) {
            cancelAnimationFrame(_rafId);
          }
          _rafId = requestAnimationFrame(function () {
            _rafId = null;
            for (const card of enabledChartCards()) {
              const id = card.id;
              if (
                state.viewMode[id] === "line" &&
                state.history[id] &&
                state.history[id].length >= 2
              ) {
                drawChart(id, state.history[id], colorFor(id));
              }
            }
          });
        });

        // -------- initial render --------

        const app = document.getElementById("app");
        // Nothing renders synchronously here: renderCards is only reached
        // from message handlers, which run after this script finishes and
        // therefore after the resize observer below is initialized.
        app.innerHTML = '<div id="card-container"></div>';

        vscode.postMessage({ type: "ready" });
      })();
    </script>
  </body>
</html>
